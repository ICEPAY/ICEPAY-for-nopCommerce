name: Build, test and package
on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/bootstrap.py
      - run: dotnet restore ICEPAY.slnx --packages .deps/packages
      - run: dotnet build ICEPAY.slnx -c Release --no-restore --disable-build-servers -m:1 /p:UseSharedCompilation=false
      - name: Package plugins and validate the release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/package.py --release-tag "$RELEASE_TAG"
      - run: dotnet test tests/ICEPAY.Tests/ICEPAY.Tests.csproj -c Release --no-build --no-restore
      - uses: actions/upload-artifact@v4
        with:
          name: ICEPAY-nopCommerce-5.00
          path: artifacts/*.zip
          if-no-files-found: error

  publish:
    name: Attach ZIP to GitHub release
    if: github.event_name == 'release'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ICEPAY-nopCommerce-5.00
          path: artifacts
      - name: Upload tested plugin ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" artifacts/*.zip
