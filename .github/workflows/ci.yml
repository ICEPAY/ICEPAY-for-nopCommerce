name: Build and test
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/bootstrap.py
      - run: dotnet restore ICEPAY.slnx --packages .deps/packages
      - run: dotnet build ICEPAY.slnx -c Release --no-restore --disable-build-servers -m:1 /p:UseSharedCompilation=false
      - run: python scripts/package.py
      - run: dotnet test tests/ICEPAY.Tests/ICEPAY.Tests.csproj -c Release --no-build --no-restore
      - uses: actions/upload-artifact@v4
        with:
          name: ICEPAY-nopCommerce-5.00
          path: artifacts/*.zip
